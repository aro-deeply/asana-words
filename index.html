<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F3F1">
<title>아사나 산스크리트 단어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans:wght@500;600;700&display=swap">
<style>
/* 레이아웃: 휴대폰 한 손 사용. 홈(진도+시작 버튼+분류 목록) → 분류 단어장 / 카드 / 퀴즈. 분류마다 고유 색 */
:root{
  --bg:#F3F3F1; --row:#FFFFFF; --ink:#1D1D1F; --muted:#7A7A75; --line:#E7E7E3; --press:#EDEDEA;
  --btn:#1D1D1F; --btn-ink:#FFFFFF; --ok:#2B8A3E; --ok-bg:#E7F5EA; --bad:#C92A2A; --bad-bg:#FCEBEB;
  --dir:#DDEBFA; --dir-ink:#1F4E79; --body:#FCE5D6; --body-ink:#8A3B12; --act:#DFF1DD; --act-ink:#2D6A2E;
  --shape:#E8E2F7; --shape-ink:#4B3A8C; --animal:#F6EBCC; --animal-ink:#76570E; --myth:#F8DFE8; --myth-ink:#8C2F4E;
  --weak:#FFE8D6; --weak-ink:#A0461A;
  --kr:"Pretendard Variable","Pretendard","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --la:"Noto Sans","Pretendard Variable","Pretendard","Noto Sans KR",-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --row:#1C1C1E; --ink:#F2F2F0; --muted:#98989D; --line:#2C2C2E; --press:#2A2A2C;
  --btn:#F2F2F0; --btn-ink:#111111; --ok:#5FD07A; --ok-bg:#15301D; --bad:#FF7B7B; --bad-bg:#3A1B1B;
  --dir:#1C2B3B; --dir-ink:#A8CEF5; --body:#3A2619; --body-ink:#F6BE98; --act:#1D2F1E; --act-ink:#A6DDA6;
  --shape:#2A2440; --shape-ink:#C9BCF5; --animal:#352C14; --animal-ink:#EBD08A; --myth:#3A1E29; --myth-ink:#F3AFC6;
  --weak:#3A2414; --weak-ink:#FFB68A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --row:#1C1C1E; --ink:#F2F2F0; --muted:#98989D; --line:#2C2C2E; --press:#2A2A2C;
  --btn:#F2F2F0; --btn-ink:#111111; --ok:#5FD07A; --ok-bg:#15301D; --bad:#FF7B7B; --bad-bg:#3A1B1B;
  --dir:#1C2B3B; --dir-ink:#A8CEF5; --body:#3A2619; --body-ink:#F6BE98; --act:#1D2F1E; --act-ink:#A6DDA6;
  --shape:#2A2440; --shape-ink:#C9BCF5; --animal:#352C14; --animal-ink:#EBD08A; --myth:#3A1E29; --myth-ink:#F3AFC6;
  --weak:#3A2414; --weak-ink:#FFB68A; color-scheme:dark}

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--kr);font-size:16px;line-height:1.5;word-break:keep-all;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:8px 48px}
.la{font-family:var(--la)}
.c-dir{--t:var(--dir);--ti:var(--dir-ink)} .c-body{--t:var(--body);--ti:var(--body-ink)} .c-act{--t:var(--act);--ti:var(--act-ink)}
.c-shape{--t:var(--shape);--ti:var(--shape-ink)} .c-animal{--t:var(--animal);--ti:var(--animal-ink)} .c-myth{--t:var(--myth);--ti:var(--myth-ink)}
.c-weak{--t:var(--weak);--ti:var(--weak-ink)}

/* 공통 */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:6px 8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px}
.nav h2{margin:0;font-size:17px;font-weight:700;text-align:center;white-space:nowrap}
.back{justify-self:start;height:40px;padding:0 10px;font-size:16px;color:var(--muted);display:inline-flex;align-items:center;gap:2px}
.back svg{width:20px;height:20px}
.navr{justify-self:end;height:34px;padding:0 12px;border-radius:999px;background:var(--row);font-size:13px;font-weight:600;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:12px}
.group{background:var(--row);border-radius:16px;overflow:hidden}
.label{font-size:14px;color:var(--muted);margin:14px 4px 0}
.btn{height:54px;border-radius:16px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--row);text-align:center;width:100%}
.btn.pri{background:var(--btn);color:var(--btn-ink)}
.btn:disabled{opacity:.4}
.btn:active,.rowb:active{background:var(--press)}
.btn.pri:active{opacity:.85;background:var(--btn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.small{font-size:13px;color:var(--muted);line-height:1.6}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .3s}

/* 홈 */
.hello{padding:18px 4px 6px}
.hello h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.hello p{margin:4px 0 0;color:var(--muted);font-size:15px}
.prog{background:var(--row);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.prog-h{display:flex;justify-content:space-between;align-items:baseline}
.prog-h b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.prog-h span{font-size:14px;color:var(--muted)}
.rowb{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);min-height:64px}
.group .rowb:first-child{border-top:0}
.sw{width:40px;height:40px;border-radius:12px;background:var(--t);color:var(--ti);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.rowb .mid{flex:1;min-width:0}
.rowb .nm{font-weight:700;font-size:16px}
.rowb .ex{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--la)}
.rowb .cnt{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.rowb .cnt svg{width:16px;height:16px;opacity:.5}
.reset{font-size:13px;color:var(--muted);padding:8px 4px;align-self:center}

/* 단어 목록 */
.w{border-top:1px solid var(--line)}
.group .w:first-child{border-top:0}
.wb{width:100%;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 16px;min-height:60px}
.sk{font-family:var(--la);font-size:19px;font-weight:600;line-height:1.3}
.rd{font-size:13px;color:var(--muted)}
.mn{font-size:16px;font-weight:500;text-align:right;max-width:44vw}
.hid{color:transparent!important;background:var(--line);border-radius:6px}
.wmore{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.spk{width:40px;height:40px;border-radius:50%;background:var(--bg);display:inline-grid;place-items:center;flex:none;color:var(--ink)}
.spk svg{width:18px;height:18px}
.rel{display:flex;flex-direction:column;gap:5px}
.rel-n{font-family:var(--la);font-weight:600;font-size:15px}
.rel-k{font-size:14px;color:var(--muted)}
.parts{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.pt{font-size:13px;padding:3px 9px;border-radius:8px;background:var(--bg);white-space:nowrap}
.pt .la{font-weight:600}
.pt.me{background:var(--t);color:var(--ti)}
.pt.out{color:var(--muted)}

/* 카드 */
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 2px}
.stage{perspective:1400px}
.card{position:relative;display:block;width:100%;height:min(56svh,480px);min-height:340px}
.inner{position:absolute;inset:0;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;background:var(--t);color:var(--ink);padding:20px 22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column}
.back-f{transform:rotateY(180deg);overflow-y:auto;background:var(--row);border:2px solid var(--t)}
.ftop{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ti);font-weight:700}
.fmid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px}
.big{font-size:clamp(36px,11vw,48px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.big.la{font-weight:600}
.sub{font-size:17px;color:var(--muted)}
.fbot{font-size:14px;color:var(--ti);display:flex;justify-content:space-between;align-items:center;min-height:40px}
.face .spk{background:rgba(255,255,255,.55)}
.back-f .spk{background:var(--t);color:var(--ti)}
.ans{padding:14px 0 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.back-f .rel{padding-top:14px}

/* 퀴즈 */
.qcard{background:var(--t);border-radius:24px;padding:18px 20px 16px;display:flex;flex-direction:column;gap:6px;min-height:190px}
.qcard .big{font-size:clamp(32px,10vw,42px)}
.opt{width:100%;min-height:58px;border-radius:16px;background:var(--row);border:2px solid transparent;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.opt .t{font-size:17px;font-weight:600}
.opt .t.la{font-size:18px}
.opt .s{font-size:13px;color:var(--muted)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.45}
.mk{font-size:14px;font-weight:700}
.opt.ok .mk{color:var(--ok)} .opt.bad .mk{color:var(--bad)}
.fb{background:var(--row);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fbh{display:flex;justify-content:space-between;align-items:center;gap:10px}

.done{background:var(--row);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;text-align:center}
.done h3{margin:0;font-size:24px;font-weight:700}
.done p{margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);font-size:14px;padding:10px 16px;border-radius:14px;max-width:calc(100% - 32px);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.inner,.bar i,.toast{transition:none}}
</style>
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>

<body>


<div class="app"><div id="view"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const CATS=[['dir','방향'],['body','신체 부위'],['act','상태·동작'],['shape','형상·상징'],['animal','동물'],['myth','인물·신화']];
const CATNAME=Object.fromEntries(CATS);
// s: IAST, r: 한글 표기, m: 뜻 (모두 교재 프린트 그대로), d: 데바나가리, ex: 연관 자세
const W=[
{c:'dir',s:'adho',r:'아도',m:'아래',d:'अधो',ex:[{n:'Adho Mukha Śvānāsana',k:'다운독 (아래를 향한 개 자세)',p:['adho','mukha','śvāna']}]},
{c:'dir',s:'ūrdhva',r:'우르드바',m:'위',d:'ऊर्ध्व',ex:[{n:'Ūrdhva Mukha Śvānāsana',k:'업독 (위를 향한 개 자세)',p:['ūrdhva','mukha','śvāna']},{n:'Ūrdhva Hastāsana',k:'두 팔을 위로 뻗고 서는 자세',p:['ūrdhva','hasta']}]},
{c:'dir',s:'ardha',r:'아르다',m:'반',d:'अर्ध',ex:[{n:'Ardha Matsyendrāsana',k:'앉아서 상체를 비트는 자세',p:['ardha','matsyendra']}]},
{c:'dir',s:'pārśva',r:'파르슈바',m:'측면',d:'पार्श्व',ex:[{n:'Pārśvottānāsana',k:'다리를 앞뒤로 벌리고 앞다리 쪽으로 숙이는 자세',p:['pārśva','uttāna']}]},
{c:'dir',s:'parivṛtta',r:'파리브리타',m:'회전된',d:'परिवृत्त',ex:[{n:'Parivṛtta Trikoṇāsana',k:'회전 삼각 자세',p:['parivṛtta','trikoṇa']}]},
{c:'dir',s:'supta',r:'수프타',m:'누운',d:'सुप्त',ex:[{n:'Supta Vīrāsana',k:'비라아사나에서 뒤로 눕는 자세',p:['supta','vīra']}]},
{c:'dir',s:'utthita',r:'우티타',m:'뻗은',d:'उत्थित',ex:[{n:'Utthita Trikoṇāsana',k:'삼각 자세',p:['utthita','trikoṇa']}]},
{c:'dir',s:'prasārita',r:'프라사리타',m:'넓게 펼친',d:'प्रसारित',ex:[{n:'Prasārita Pādottānāsana',k:'다리를 넓게 벌리고 앞으로 숙이는 자세',p:['prasārita','pāda','uttāna']}]},
{c:'body',s:'hasta',r:'하스타',m:'손',d:'हस्त',ex:[{n:'Ūrdhva Hastāsana',k:'두 팔을 위로 뻗고 서는 자세',p:['ūrdhva','hasta']},{n:'Pādahastāsana',k:'서서 숙여 손을 발에 대는 자세',p:['pāda','hasta']}]},
{c:'body',s:'pāda',r:'파다',m:'발',d:'पाद',ex:[{n:'Pādahastāsana',k:'서서 숙여 손을 발에 대는 자세',p:['pāda','hasta']},{n:'Eka Pāda Rājakapotāsana',k:'한 발 왕비둘기 자세',p:[['eka','하나'],'pāda',['rāja','왕'],'kapota']}]},
{c:'body',s:'mukha',r:'무카',m:'얼굴',d:'मुख',ex:[{n:'Adho Mukha Śvānāsana',k:'다운독 (아래를 향한 개 자세)',p:['adho','mukha','śvāna']},{n:'Gomukhāsana',k:'다리를 포개 앉고 등 뒤에서 손을 잡는 소 얼굴 자세',p:[['go','소'],'mukha']}]},
{c:'body',s:'śīrṣa',r:'시르샤',m:'머리',d:'शीर्ष',ex:[{n:'Śīrṣāsana',k:'머리서기',p:['śīrṣa']}]},
{c:'body',s:'jānu',r:'자누',m:'무릎',d:'जानु',ex:[{n:'Jānu Śīrṣāsana',k:'한 다리를 접고 앉아 뻗은 다리 쪽으로 숙이는 자세',p:['jānu','śīrṣa']}]},
{c:'act',s:'uttāna',r:'욷타나',m:'깊게 펼친',d:'उत्तान',ex:[{n:'Uttānāsana',k:'서서 앞으로 숙이는 자세',p:['uttāna']},{n:'Pārśvottānāsana',k:'다리를 앞뒤로 벌리고 앞다리 쪽으로 숙이는 자세',p:['pārśva','uttāna']}]},
{c:'act',s:'utkaṭa',r:'웃카타',m:'강렬한',d:'उत्कट',ex:[{n:'Utkaṭāsana',k:'의자 자세',p:['utkaṭa']}]},
{c:'act',s:'daṇḍa',r:'단다',m:'막대기',d:'दण्ड',ex:[{n:'Daṇḍāsana',k:'다리를 앞으로 뻗고 곧게 앉는 자세',p:['daṇḍa']},{n:'Caturaṅga Daṇḍāsana',k:'팔을 굽혀 몸을 바닥과 나란히 버티는 자세',p:[['caturaṅga','네 팔다리'],'daṇḍa']}]},
{c:'act',s:'namaskāra',r:'나마스카라',m:'경배',d:'नमस्कार',ex:[{n:'Sūrya Namaskāra',k:'태양 경배 (연속 동작)',p:[['sūrya','태양'],'namaskāra']}]},

{c:'shape',s:'trikoṇa',r:'트리코나',m:'삼각형',d:'त्रिकोण',ex:[{n:'Utthita Trikoṇāsana',k:'삼각 자세',p:['utthita','trikoṇa']},{n:'Parivṛtta Trikoṇāsana',k:'회전 삼각 자세',p:['parivṛtta','trikoṇa']}]},
{c:'shape',s:'padma',r:'파드마',m:'연꽃',d:'पद्म',ex:[{n:'Padmāsana',k:'연꽃 자세 (결가부좌)',p:['padma']}]},
{c:'shape',s:'vajra',r:'바즈라',m:'금강',d:'वज्र',ex:[{n:'Vajrāsana',k:'무릎을 꿇고 발뒤꿈치 위에 앉는 자세',p:['vajra']}]},
{c:'shape',s:'hala',r:'할라',m:'쟁기',d:'हल',ex:[{n:'Halāsana',k:'누워서 다리를 머리 너머로 넘기는 쟁기 자세',p:['hala']}]},
{c:'shape',s:'dhanus',r:'다누스',m:'활',d:'धनुस्',ex:[{n:'Dhanurāsana',k:'엎드려 발목을 잡고 활처럼 젖히는 자세',p:['dhanus']},{n:'Ūrdhva Dhanurāsana',k:'누워서 손발로 몸을 둥글게 들어 올리는 휠 자세',p:['ūrdhva','dhanus']}]},
{c:'shape',s:'cakra',r:'차크라',m:'바퀴',d:'चक्र',ex:[{n:'Cakrāsana',k:'바퀴 자세 (흔히 Ūrdhva Dhanurāsana와 같은 휠 자세)',p:['cakra']}]},
{c:'shape',s:'setu',r:'세투',m:'다리',d:'सेतु',ex:[{n:'Setu Bandha Sarvāṅgāsana',k:'누워서 엉덩이를 들어 올리는 브릿지 자세',p:['setu','bandha',['sarvāṅga','온몸']]}]},
{c:'animal',s:'śvāna',r:'슈바나',m:'개',d:'श्वान',ex:[{n:'Adho Mukha Śvānāsana',k:'다운독',p:['adho','mukha','śvāna']},{n:'Ūrdhva Mukha Śvānāsana',k:'업독',p:['ūrdhva','mukha','śvāna']}]},
{c:'animal',s:'bhujaṅga',r:'부장가',m:'코브라',d:'भुजङ्ग',ex:[{n:'Bhujaṅgāsana',k:'엎드려 상체를 들어 올리는 코브라 자세',p:['bhujaṅga']}]},
{c:'animal',s:'bitila',r:'비틸라',m:'소',d:'बितिल',ex:[{n:'Bitilāsana',k:'네발 자세에서 등을 내리고 고개를 드는 소 자세 (고양이 자세와 짝)',p:['bitila']}]},

const store={get(k,d){try{const v=localStorage.getItem('asana2:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('asana2:'+k,JSON.stringify(v))}catch(e){}}};
const S={screen:'home',scope:'all',dir:store.get('dir','s2k'),hide:false,open:new Set(),known:new Set(store.get('known',[])),weak:new Set(store.get('weak',[])),deck:null,quiz:null,resetArm:false};
const save=()=>{store.set('known',[...S.known]);store.set('weak',[...S.weak])};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const scopeWords=sc=>sc==='all'?W:sc==='weak'?W.filter(w=>S.weak.has(w.id)):W.filter(w=>w.c===sc);
const scopeName=sc=>sc==='all'?'전체':sc==='weak'?'헷갈린 단어':CATNAME[sc];
const DIRS={s2k:'산스크리트 → 뜻',k2s:'뜻 → 산스크리트',mix:'섞어서'};
const pickDir=()=>S.dir==='mix'?(Math.random()<.5?'s2k':'k2s'):S.dir;
const ICON={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  spk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>'
};

/* 발음: 단어별 합성음을 앱 안에 포함 */
let player=null;
function speak(id){
  try{if(player)player.pause();player=new Audio('data:audio/mpeg;base64,'+AUD[id]);
    const pr=player.play();if(pr&&pr.catch)pr.catch(()=>toast('소리가 안 나요. 무음 모드와 볼륨을 확인해 주세요'));
  }catch(e){toast('소리를 재생하지 못했어요')}
}
const spk=id=>`<button class="spk" data-act="speak" data-id="${id}" aria-label="${esc(W[id].s)} 발음 듣기">${ICON.spk}</button>`;
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}

function relHTML(w){
  return w.ex.map(e=>`<div class="rel"><div class="rel-n">${esc(e.n)}</div><div class="rel-k">${esc(e.k)}</div><div class="parts">${e.p.map(p=>{
    if(Array.isArray(p))return `<span class="pt out"><span class="la">${esc(p[0])}</span> ${esc(p[1])}</span>`;
    const x=BY[p];return `<span class="pt${x.id===w.id?' me':''}"><span class="la">${esc(x.s)}</span> ${esc(x.m)}</span>`}).join('')}<span class="pt out"><span class="la">āsana</span> 자세</span></div></div>`).join('');
}
const nav=(title,right='')=>`<div class="nav"><button class="back" data-act="home">${ICON.back}처음</button><h2>${esc(title)}</h2><div style="justify-self:end">${right}</div></div>`;
const dirBtn=()=>`<button class="navr" data-act="dir">${DIRS[S.dir]}</button>`;

/* 홈 */
function home(){
  const k=S.known.size;
  const rows=CATS.map(([c,n])=>{const ws=W.filter(w=>w.c===c);const kn=ws.filter(w=>S.known.has(w.id)).length;
    return `<button class="rowb c-${c}" data-act="open" data-v="${c}"><span class="sw">${ws.length}</span><span class="mid"><span class="nm">${n}</span><br><span class="ex">${ws.slice(0,3).map(w=>esc(w.s)).join(', ')}${ws.length>3?' …':''}</span></span><span class="cnt">${kn}/${ws.length}${ICON.chev}</span></button>`}).join('');
  const weak=S.weak.size?`<div class="group"><button class="rowb c-weak" data-act="open" data-v="weak"><span class="sw">${S.weak.size}</span><span class="mid"><span class="nm">헷갈린 단어</span><br><span class="ex" style="font-family:var(--kr)">카드에서 다시 보거나 퀴즈에서 틀린 단어</span></span><span class="cnt">${ICON.chev}</span></button></div>`:'';
  return `<div class="stack">
    <div class="hello"><h1>아사나 단어장</h1><p>프린트에 있는 산스크리트어 41개</p></div>
    <div class="prog"><div class="prog-h"><b>${k} <span>/ 41 외웠어요</span></b><span>${k===41?'다 외웠어요':k?'계속 가 볼까요':'카드부터 시작해 보세요'}</span></div><div class="bar"><i style="width:${Math.round(k/41*100)}%"></i></div></div>
    <div class="two"><button class="btn pri" data-act="card" data-v="all">카드로 외우기</button><button class="btn" data-act="quiz" data-v="all">퀴즈 풀기</button></div>
    ${weak}
    <div class="label">분류별로 보기</div>
    <div class="group">${rows}</div>
    <p class="small" style="margin:6px 4px 0">자세 이름은 단어 뒤에 āsana(자세)를 붙여 만들어요. 예를 들어 śvāna(개) + āsana는 Śvānāsana가 돼요.</p>
    ${k||S.weak.size?`<button class="reset" data-act="reset">${S.resetArm?'한 번 더 누르면 기록이 지워져요':'외운 기록 지우기'}</button>`:''}
  </div>`;
}

/* 분류 단어장 */
function list(){
  const ws=scopeWords(S.scope);
  if(!ws.length)return nav(scopeName(S.scope))+`<div class="done"><h3>모두 정리됐어요</h3><p>헷갈린 단어가 없어요.</p><button class="btn pri" data-act="home">처음으로</button></div>`;
  const cls=S.scope==='all'?'':`c-${S.scope}`;
  return nav(scopeName(S.scope),`<button class="navr" data-act="hide">${S.hide?'뜻 보이기':'뜻 가리기'}</button>`)+`<div class="stack ${cls}">
    <div class="two"><button class="btn pri" data-act="card" data-v="${S.scope}">카드로 외우기</button><button class="btn" data-act="quiz" data-v="${S.scope}">퀴즈 풀기</button></div>
    <div class="group">${ws.map(wRow).join('')}</div>
    <p class="small" style="margin:2px 4px 0">단어를 누르면 발음과 연관 자세가 나와요.${S.hide?' 가려진 뜻도 누르면 보여요.':''}</p></div>`;
}
function wRow(w){
  const o=S.open.has(w.id),h=S.hide&&!o;
  return `<div class="w c-${w.c}"><button class="wb" data-act="row" data-id="${w.id}" aria-expanded="${o}"><span><span class="sk">${esc(w.s)}</span><br><span class="rd">${esc(w.r)}</span></span><span class="mn${h?' hid':''}">${esc(w.m)}</span></button>
  ${o?`<div class="wmore"><div style="display:flex;align-items:center;gap:10px">${spk(w.id)}<span class="rd">${esc(w.d)}</span></div>${relHTML(w)}</div>`:''}</div>`;
}

/* 카드 */
function newDeck(sc){const ids=scopeWords(sc).map(w=>w.id);S.deck={sc,q:shuffle(ids).map(id=>({id,dir:pickDir()})),total:ids.length,known:0,again:0,seen:new Set(),flip:false}}
function card(){
  const D=S.deck;
  if(!D.total)return nav('카드')+`<div class="done"><h3>볼 단어가 없어요</h3><button class="btn pri" data-act="home">처음으로</button></div>`;
  if(!D.q.length)return nav(scopeName(D.sc))+`<div class="done"><h3>한 바퀴 끝났어요</h3><p>${D.total}개 중 바로 안 단어 ${D.known}개, 다시 본 단어 ${D.again}개</p>
    <div class="two"><button class="btn" data-act="card" data-v="weak" ${S.weak.size?'':'disabled'}>헷갈린 것만</button><button class="btn pri" data-act="card" data-v="${D.sc}">한 번 더</button></div></div>`;
  const cur=D.q[0],w=W[cur.id],seenN=D.seen.size;
  const showR=w.r!==w.m;
  const front=cur.dir==='s2k'?`<div class="big la">${esc(w.s)}</div>${showR?`<div class="sub">${esc(w.r)}</div>`:''}`:`<div class="big">${esc(w.m)}</div>`;
  const ans=cur.dir==='s2k'
    ?`<div class="big" style="font-size:clamp(28px,8vw,36px)">${esc(w.m)}</div><div class="sub"><span class="la">${esc(w.s)}</span> · ${esc(w.r)}</div>`
    :`<div class="big la" style="font-size:clamp(30px,9vw,38px)">${esc(w.s)}</div><div class="sub">${esc(w.r)} · ${esc(w.m)}</div>`;
  return nav(scopeName(D.sc),dirBtn())+`<div class="stack c-${w.c}">
    <div class="meta"><span>${seenN} / ${D.total}</span><span>${esc(CATNAME[w.c])}</span></div>
    <div class="bar"><i style="width:${Math.round(seenN/D.total*100)}%"></i></div>
    <div class="stage"><div class="card${D.flip?' flipped':''}" id="card" role="button" tabindex="0" aria-label="카드 뒤집기">
      <div class="inner">
        <div class="face"><div class="ftop"><span>${cur.dir==='s2k'?'무슨 뜻일까요?':'산스크리트어로?'}</span>${cur.dir==='s2k'?spk(w.id):''}</div><div class="fmid">${front}</div><div class="fbot"><span>눌러서 답 보기</span></div></div>
        <div class="face back-f"><div class="ftop"><span>${esc(CATNAME[w.c])}</span>${spk(w.id)}</div><div class="ans">${ans}</div>${relHTML(w)}</div>
      </div></div></div>
    <div class="two"><button class="btn" data-act="again">다시 볼래요</button><button class="btn pri" data-act="know">외웠어요</button></div></div>`;
}
function cardAnswer(know){
  const D=S.deck,cur=D.q.shift(),first=!D.seen.has(cur.id);D.seen.add(cur.id);
  if(know){if(first)D.known++;S.known.add(cur.id);S.weak.delete(cur.id)}
  else{if(first)D.again++;S.known.delete(cur.id);S.weak.add(cur.id);const pos=Math.min(D.q.length,3+Math.floor(Math.random()*3));D.q.splice(pos,0,{id:cur.id,dir:pickDir()})}
  save();D.flip=false;render();
}

/* 퀴즈 */
function newQuiz(sc,ids){ids=ids||scopeWords(sc).map(w=>w.id);const l=shuffle(ids).slice(0,Math.min(10,ids.length));S.quiz={sc,items:l.map(id=>({id,dir:pickDir()})),i:0,score:0,wrong:[]}}
function quiz(){
  const Q=S.quiz;
  if(!Q.items.length)return nav('퀴즈')+`<div class="done"><h3>낼 문제가 없어요</h3><button class="btn pri" data-act="home">처음으로</button></div>`;
  if(Q.i>=Q.items.length){
    const wr=Q.wrong.map(id=>W[id]);
    return nav(scopeName(Q.sc))+`<div class="stack"><div class="done"><h3>${Q.items.length}문제 중 ${Q.score}개 맞혔어요</h3><p>${wr.length?'틀린 단어는 헷갈린 단어에 모아 뒀어요.':'전부 맞혔어요.'}</p></div>
    ${wr.length?`<div class="group">${wr.map(w=>`<div class="w"><div class="wb"><span><span class="sk">${esc(w.s)}</span><br><span class="rd">${esc(w.r)}</span></span><span class="mn">${esc(w.m)}</span></div></div>`).join('')}</div>`:''}
    <div class="two"><button class="btn" data-act="qretry" ${wr.length?'':'disabled'}>틀린 것만 다시</button><button class="btn pri" data-act="quiz" data-v="${Q.sc}">새 문제</button></div></div>`;
  }
  const it=Q.items[Q.i],w=W[it.id];
  if(!it.opts){const same=shuffle(W.filter(x=>x.c===w.c&&x.id!==w.id)),rest=shuffle(W.filter(x=>x.c!==w.c));it.opts=shuffle([w,...same.concat(rest).slice(0,3)]).map(x=>x.id)}
  const ans=it.pick!=null;
  const prompt=it.dir==='s2k'?`<div class="big la">${esc(w.s)}</div>${w.r!==w.m?`<div class="sub">${esc(w.r)}</div>`:''}`:`<div class="big">${esc(w.m)}</div>`;
  const opts=it.opts.map(id=>{const x=W[id];let cls='',mk='';
    if(ans){if(id===w.id){cls=' ok';mk='정답'}else if(id===it.pick){cls=' bad';mk='오답'}else cls=' dim'}
    const body=it.dir==='s2k'?`<span class="t">${esc(x.m)}</span>`:`<span><span class="t la">${esc(x.s)}</span><br><span class="s">${esc(x.r)}</span></span>`;
    return `<button class="opt${cls}" data-act="pick" data-id="${id}" ${ans?'disabled':''}>${body}<span class="mk">${mk}</span></button>`}).join('');
  return nav(scopeName(Q.sc),dirBtn())+`<div class="stack c-${w.c}">
    <div class="meta"><span>${Q.i+1} / ${Q.items.length}</span><span>맞힌 문제 ${Q.score}</span></div>
    <div class="bar"><i style="width:${Math.round(Q.i/Q.items.length*100)}%"></i></div>
    <div class="qcard"><div class="ftop"><span>${it.dir==='s2k'?'무슨 뜻일까요?':'산스크리트어로?'}</span>${it.dir==='s2k'?spk(w.id):''}</div><div class="fmid" style="padding:10px 0">${prompt}</div></div>
    ${opts}
    ${ans?`<div class="fb"><div class="fbh"><span><span class="sk">${esc(w.s)}</span> <span class="rd">${esc(w.r)} · ${esc(w.m)}</span></span>${spk(w.id)}</div>${relHTML(w)}</div>
    <button class="btn pri" data-act="qnext">${Q.i+1<Q.items.length?'다음 문제':'결과 보기'}</button>`:''}</div>`;
}

function render(){
  const v=S.screen==='home'?home():S.screen==='list'?list():S.screen==='card'?card():quiz();
  $('#view').innerHTML=v;
}
function go(screen){S.screen=screen;S.resetArm=false;render();window.scrollTo(0,0)}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){const c=e.target.closest('#card');if(c&&S.deck){S.deck.flip=!S.deck.flip;c.classList.toggle('flipped',S.deck.flip)}return}
  const a=b.dataset.act,v=b.dataset.v,id=+b.dataset.id;
  if(a==='speak'){e.stopPropagation();speak(id);return}
  if(a==='home')return go('home');
  if(a==='open'){S.scope=v;S.open.clear();S.hide=false;return go('list')}
  if(a==='card'){newDeck(v);return go('card')}
  if(a==='quiz'){newQuiz(v);return go('quiz')}
  if(a==='hide'){S.hide=!S.hide;S.open.clear();return render()}
  if(a==='row'){S.open.has(id)?S.open.delete(id):S.open.add(id);b.closest('.w').outerHTML=wRow(W[id]);return}
  if(a==='dir'){const order=['s2k','k2s','mix'];S.dir=order[(order.indexOf(S.dir)+1)%3];store.set('dir',S.dir);
    if(S.screen==='card'&&S.deck){S.deck.q.forEach(x=>x.dir=pickDir());S.deck.flip=false}
    if(S.screen==='quiz'&&S.quiz){S.quiz.items.slice(S.quiz.i).forEach(x=>{if(x.pick==null)x.dir=pickDir()})}
    toast('문제 방향: '+DIRS[S.dir]);return render()}
  if(a==='again'||a==='know')return cardAnswer(a==='know');
  if(a==='pick'){const Q=S.quiz,it=Q.items[Q.i];it.pick=id;if(id===it.id){Q.score++;S.known.add(it.id)}else{Q.wrong.push(it.id);S.weak.add(it.id);S.known.delete(it.id)}save();return render()}
  if(a==='qnext'){S.quiz.i++;render();window.scrollTo(0,0);return}
  if(a==='qretry'){newQuiz(S.quiz.sc,S.quiz.wrong.slice());return go('quiz')}
  if(a==='reset'){if(!S.resetArm){S.resetArm=true;return render()}S.known.clear();S.weak.clear();save();S.resetArm=false;toast('기록을 지웠어요');return render()}
});
document.addEventListener('keydown',e=>{const c=e.target.closest&&e.target.closest('#card');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.deck.flip=!S.deck.flip;c.classList.toggle('flipped',S.deck.flip)}});
render();
</script>
